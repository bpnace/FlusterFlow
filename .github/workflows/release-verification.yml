name: Release verification

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the release candidate on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    name: Build and test release candidate
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer

    steps:
      - name: Verify release candidate
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || "$RELEASE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::Dispatch on main with the full SHA of its current head."
            exit 1
          fi

      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build unsigned debug app
        run: |
          xcodebuild \
            -project WhisperFlow.xcodeproj \
            -scheme WhisperFlow \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run capped app tests using the Xcode build
        run: bash Scripts/run-capped-tests.sh
