name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests, and local privacy gates
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify required tools
        run: |
          command -v jq

      - name: Verify repository hygiene
        run: bash Scripts/verify-repository-hygiene.sh --history

      - name: Select Swift 6.2 toolchain
        run: |
          developer_dir=/Applications/Xcode_26.0.1.app/Contents/Developer
          test -x "$developer_dir/usr/bin/xcodebuild"
          printf 'DEVELOPER_DIR=%s\n' "$developer_dir" >> "$GITHUB_ENV"

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test unsigned debug app
        run: bash Scripts/run-capped-tests.sh --full

      - name: Build and test verification tools
        env:
          FLUSTERFLOW_SUPPORT_TESTS_ONLY: '1'
        run: |
          # Give the dependency-free package its own workspace and lockfile.
          package_dir="$(mktemp -d "$RUNNER_TEMP/flusterflow-support.XXXXXX")"
          cp Package.swift "$package_dir/"
          ln -s "$PWD/TestSupport" "$PWD/Tests" "$PWD/Tools" "$package_dir/"
          swift test --package-path "$package_dir"
          bin_dir="$(swift build --package-path "$package_dir" --show-bin-path)"
          printf 'VERIFICATION_BIN_DIR=%s\n' "$bin_dir" >> "$GITHUB_ENV"

      - name: Verify signed artifact handoff contracts
        run: bash Scripts/test-verified-artifact-chain.sh

      - name: Verify target harness
        run: bash Scripts/verify-target-harness.sh --bin-dir "$VERIFICATION_BIN_DIR"

      - name: Verify local network boundary and privacy harness
        run: bash Scripts/verify-local-privacy.sh --bin-dir "$VERIFICATION_BIN_DIR"

      - name: Confirm signing gate is credential-gated
        run: |
          set +e
          output="$(bash Scripts/verify-private-signing.sh --check-prerequisites 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 77
          printf '%s\n' "$output" | jq -e \
            '.status == "blocked" and .reason == "identity_required"' >/dev/null
